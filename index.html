<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>무인도 생존기</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 토스트 알림 -->
<div id="toast" class="toast"></div>

<!-- START -->
<div id="startScreen" class="overlay show">
  <div class="sbox">
    <h1>🏝 무인도 생존기</h1>
    <p>섬에 표류했다. 구조 신호를 100%까지 올려 탈출하거나,<br>살아남지 못하면 이 섬이 당신의 무덤이 된다.</p>
    <div class="dcards" id="diffCards"></div>
    <button class="start-btn" onclick="startGame()">🚨 생존 시작</button>
  </div>
</div>

<!-- DAY MODAL -->
<div id="dayModal" class="overlay">
  <div class="dmo">
    <div class="dmo-title">생존 일지</div>
    <div class="dmo-day" id="dmoDay">2일차</div>
    <div class="dmo-changes" id="dmoChanges"></div>
    <div class="dmo-evt" id="dmoEvt"></div>
    <button class="dmo-btn" onclick="closeDayModal()">계속하기</button>
    <div class="dmo-timer" id="dmoTimer"></div>
  </div>
</div>

<!-- COOK MODAL -->
<div id="cookModal" class="overlay">
  <div class="cook-modal">
    <div class="cook-modal-header">
      <div class="cook-modal-title" id="cookModalTitle">🍳 요리대</div>
      <button class="cook-modal-back" id="cookModalBack" onclick="cookGoBack()" style="display:none">← 뒤로</button>
      <button class="cook-modal-close" id="cookModalClose" onclick="closeCookModal()">✕ 닫기</button>
    </div>
    <div id="cookModalBody"></div>
  </div>
</div>

<!-- END -->
<div id="endScreen" class="overlay">
  <div class="ebox">
    <div class="eh" id="endTitle">💀 사망</div>
    <div class="em" id="endMsg"></div>
    <div class="es" id="endStats"></div>
    <button class="eb" onclick="showStartScreen()">↩ 다시 시작</button>
  </div>
</div>

<!-- MAIN GAME -->
<div id="mainGame" style="display:none">
  <div class="top-bar">
    <div class="top-title">🏝 무인도 생존기</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="badge" id="topDay" style="color:#58a6ff">1일차</span>
      <span class="badge" id="topTime" style="color:#e3b341">🌅 아침 00:00</span>
      <span class="badge" id="diffBadge" style="color:#8b949e;font-size:11px"></span>
    </div>
    <button class="rst-btn" onclick="showStartScreen()">↩ 처음으로</button>
  </div>

  <div class="game-grid">
    <!-- LEFT -->
    <div>
      <div class="panel">
        <div class="ptitle">생존자</div>
        <div class="char-center">
          <div class="char-svg" id="charSvg"></div>
          <div id="charSt" class="char-st st-healthy">건강</div>
          <div class="equipped" id="equipped"></div>
          <div id="charShelter"></div>
          <div id="charActions"></div>
        </div>
      </div>
      <div class="panel">
        <div class="ptitle">생존 지표</div>
        <div id="statsArea"></div>
      </div>
      <div class="panel">
        <div class="ptitle">인벤토리</div>
        <div class="inv-grid" id="invGrid"></div>
      </div>
    </div>

    <!-- CENTER -->
    <div>
      <div class="panel">
        <div class="ptitle">위치 이동</div>
        <div class="loc-tabs" id="locTabs"></div>
        <div class="loc-hdr">
          <div class="loc-ico" id="locIco">🏖</div>
          <div class="loc-info"><h2 id="locNm">해변</h2><p id="locDesc"></p></div>
        </div>
        <div class="act-status" id="actStatus"></div>

        <!-- 은신처 서브탭 (은신처에서만 표시) -->
        <div id="shelterTabBar" style="display:none">
          <div class="shelter-tabs">
            <button class="stab stab-cur" data-tab="act" onclick="switchShelterTab('act')">⚡ 행동</button>
            <button class="stab" data-tab="craft" onclick="switchShelterTab('craft')">⚒ 제작대</button>
            <button class="stab" data-tab="cook" onclick="switchShelterTab('cook')">🍳 요리대</button>
          </div>
        </div>

        <!-- 행동 패널 -->
        <div id="actPanel">
          <div class="act-grid" id="actGrid"></div>
          <button class="nd-btn" id="ndBtn">⏩ 다음 날로 넘기기</button>
        </div>

        <!-- 제작 패널 (은신처에서만) -->
        <div id="craftPanel" style="display:none">
          <div class="craft-grid" id="craftGrid"></div>
        </div>

        <!-- 요리 패널 (은신처에서만) -->
        <div id="cookPanel" style="display:none"></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <div class="panel">
        <div class="ptitle">생존 현황</div>
        <div class="day-row">
          <div class="day-n" id="rightDay">1일차</div>
          <div class="time-b t-morning" id="rightTime">🌅 아침</div>
        </div>
        <div class="pips-row">
          <span>시간</span>
          <div id="pipRow"></div>
          <span id="actRem" style="color:#e6edf3;font-weight:700;font-size:11px"></span>
        </div>
        <div class="resc-lbl"><span>🆘 구조 신호 진행도</span><b id="rescPct">0%</b></div>
        <div class="resc-bar"><div class="resc-fill" id="rescFill" style="width:0%"></div></div>
      </div>
      <div class="panel">
        <div class="ptitle">생존 일지</div>
        <div class="log-wrap" id="logWrap"></div>
      </div>
    </div>
  </div>
</div>

<script src="./script.js"></script>
</body>
</html>
